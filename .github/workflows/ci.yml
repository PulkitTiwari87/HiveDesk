name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows executables
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: hivedesk-windows
          path: |
            dist/*.exe
          if-no-files-found: error
